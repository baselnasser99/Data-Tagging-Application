{% extends 'base.html' %}

{% block content %}
  <section class="content-header">
    <h1>New group</h1>
    <p class="text-muted page-subtitle">A group is a team of members. Give it projects on "Assign to a group".</p>
  </section>

  <section class="content form-page">
    <div class="box">
      <form action="{{ url_for('groups.create_group') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="box-body">
          <div class="form-group">
            <label for="group_name">Name</label>
            <input type="text" class="form-control" id="group_name" name="group_name" required>
            <p class="help-block">Every group needs a different name.</p>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="group_desc">Description (optional)</label>
            <textarea class="form-control" id="group_desc" name="group_desc" rows="2"></textarea>
          </div>
        </div>
        <div class="box-footer quick-actions">
          <button type="submit" class="btn btn-primary">Create group</button>
          <a href="{{ url_for('groups.view_groups') }}" class="btn btn-default">Cancel</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
