{% extends "base.html" %}

{% block content %}
<!-- Content Header (Page header) -->
<section class="content-header">
	<h1>
		Create Project
	</h1>
	<ol class="breadcrumb">
		<li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
		<li>Projects</li>
		<li class="active">Create</li>
	</ol>
</section>
<section>
    {% include "flash_messages.html" %}
</section>
<section style="margin-top: 20px; padding: 10px;">
    <form action="{{ url_for('admin.create_project') }}" method="POST" enctype="multipart/form-data">
        <div class="row justify-content-between gap-2 gap-md-0">
            {% include "flash_messages.html" %}
            <div class="col-xs-12 col-sm-12 col-md-5 col-lg-4 border p-4 rounded bg-white shadow-sm">
                <h4>Project Details</h4>
                <div class="mt-3">
                    <label class="form-label fw-bold">Project Name</label>
                    <input type="text" name="project_name" class="form-control mb-3" required>

                    <label class="form-label fw-bold">Project Description</label>
                    <textarea rows="10" class="form-control mb-3" name="project_desc"></textarea>

                    <input type="submit" class="btn btn-primary" value="Save" style="margin-top: 10px;">
                </div>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-7 col-lg-8 border p-4 rounded bg-white shadow-sm">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4>Questions</h4>
                    <input type="hidden" name="total_questions" id="total_questions" value="1">
                    <button type="button" onclick="addQuestion()" class="btn btn-primary btn-sm fw-bold">Add Question</button>
                </div>

                <div class="mt-3" id="questions">
                    <div class="mb-3 quiz-section">
                        <label class="form-label fw-bold">Question 1</label>
                        <div class="mb-2">
                            <label class="form-label">Upload Image or Audio</label>
                            <input type="file" name="question-1-file" class="form-control">
                        </div>
                        <label class="form-label">Question</label>
                        <textarea rows="1" class="form-control" name="question-1" placeholder="Enter Question Text" required></textarea>
                        
                        <div class="mt-2 mb-2">
                            <label class="form-label">Answer Type</label>
                            <select name="dropdown-1" class="form-control dropdown-value">
                                <option value="text">Text</option>
                                <option value="mcq">MCQ</option>
                            </select>
                        </div>

                        <div class="mt-2 mb-2 mcq-options" style="display: none;">
                            <label class="form-label">Number of Options</label>
                            <input type="number" name="number_of_options-1" class="form-control number-of-options" min="1" max="6" value="0">
                            <label class="form-label mt-2">MCQ Options</label>
                            <div class="options-container"></div>
                        </div>

                        <label class="form-label">Answer</label>
                        
                        <textarea rows="1" class="form-control" name="answer-1" placeholder="Enter Answer Text"></textarea>
                    </div>
                    <!-- MORE QUESTIONS WILL BE ADDED USING JS -->
                </div>
            </div>
        </div>
    </form>
</section>
{% endblock %}

{% block scripts %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function toggleMcqOptions(section) {
                const dropdown = section.querySelector('.dropdown-value');
                const mcqOptions = section.querySelector('.mcq-options');
                const numberOfOptionsInput = section.querySelector('.number-of-options');
                const optionsContainer = section.querySelector('.options-container');
                
                // Fix: Disable hidden fields on form submit
                dropdown.addEventListener('change', function () {
                    if (dropdown.value === 'mcq') {
                        mcqOptions.style.display = 'block';
                        numberOfOptionsInput.disabled = false;
                        const allOptionInputs = mcqOptions.querySelectorAll('input');
                        allOptionInputs.forEach(input => input.disabled = false);
                    } else {
                        mcqOptions.style.display = 'none';
                        numberOfOptionsInput.disabled = true;
                        const allOptionInputs = mcqOptions.querySelectorAll('input');
                        allOptionInputs.forEach(input => input.disabled = true);
                    }
                });

                numberOfOptionsInput.addEventListener('change', function() {
                    populateOptions(optionsContainer, numberOfOptionsInput.value);
                });

                // Trigger change events on page load to set the initial state
                dropdown.dispatchEvent(new Event('change'));
                numberOfOptionsInput.dispatchEvent(new Event('change'));
            }

            function populateOptions(container, numberOfOptions) {
                container.innerHTML = '';
                for (let i = 1; i <= numberOfOptions; i++) {
                    const optionInput = document.createElement('input');
                    optionInput.type = 'text';
                    optionInput.name = `mcq-option-${i}-${container.parentElement.parentElement.querySelector('label').textContent.split(' ')[1]}`;
                    optionInput.placeholder = `Option ${i}`;
                    optionInput.className = 'form-control mb-2';
                    container.appendChild(optionInput);
                }
            }

            const quizSections = document.querySelectorAll('.quiz-section');
            quizSections.forEach(section => toggleMcqOptions(section));

            let questionsContainer = document.querySelector("#questions");
            let totalQuestions = 1;

            window.addQuestion = function() {
                totalQuestions += 1;
                document.getElementById('total_questions').value = totalQuestions;
                const questionHtml = `
                    <div class="mb-3 quiz-section">
                        <label class="form-label fw-bold" style="margin-top: 20px;">Question ${totalQuestions}</label>
                        <div class="mb-2">
                            <label class="form-label">Upload Image or Audio</label>
                            <input type="file" name="question-${totalQuestions}-file" class="form-control">
                        </div>
                        <label class="form-label">Question</label>
                        <textarea rows="1" class="form-control" name="question-${totalQuestions}" placeholder="Enter Question Text" required></textarea>

                        <div class="mt-2 mb-2">
                            <label class="form-label">Answer Type</label>
                            <select name="dropdown-${totalQuestions}" class="form-control dropdown-value">
                                <option value="text">Text</option>
                                <option value="mcq">MCQ</option>
                            </select>
                        </div>

                        <div class="mt-2 mb-2 mcq-options" style="display: none;">
                            <label class="form-label">Number of Options</label>
                            <input type="number" name="number_of_options-${totalQuestions}" class="form-control number-of-options" min="1" max="6" value="0">
                            <label class="form-label mt-2">MCQ Options</label>
                            <div class="options-container"></div>
                        </div>

                        <label class="form-label">Answer</label>
                        <textarea rows="1" class="form-control" name="answer-${totalQuestions}" placeholder="Enter Answer Text"></textarea>
                    </div>
                `;

                const doc = new DOMParser().parseFromString(questionHtml, 'text/html');
                const newQuestion = doc.body.firstChild;

                questionsContainer.appendChild(newQuestion);

                toggleMcqOptions(newQuestion);
            }
        });
    </script>
{% endblock %}
