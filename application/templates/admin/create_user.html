{% extends 'base.html' %}

{% block title %}Add a user – {{ app_name }}{% endblock %}

{% block content %}
  <section class="content-header">
    <h1>Add a user</h1>
  </section>

  <section class="content">
    <div class="row">
      <div class="col-md-6">
        <div class="box">
          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="box-body">
              <div class="form-group">
                <label for="full_name">Full name</label>
                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required>
              </div>
              <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ form.get('email', '') }}" required>
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password">
                <p class="help-block">At least 6 characters. Leave it empty and a temporary password is created and shown to you.</p>
              </div>
              <fieldset class="form-group">
                <legend style="font-size: 15px; font-weight: 700; border: 0; margin-bottom: 6px;">Role</legend>
                <div class="radio"><label><input type="radio" name="role" value="annotator" {% if form.get('role', 'annotator') != 'manager' %}checked{% endif %}>
                  Annotator <span class="text-muted">– answers tasks in the projects of their groups</span></label></div>
                <div class="radio"><label><input type="radio" name="role" value="manager" {% if form.get('role') == 'manager' %}checked{% endif %}>
                  Manager <span class="text-muted">– runs projects; give them one now or later on the Managers page</span></label></div>
              </fieldset>
              <div class="form-group">
                <label for="group_id">Add to group (optional, annotators only)</label>
                <select class="form-control" id="group_id" name="group_id">
                  <option value="">No group</option>
                  {% for group in groups %}
                  <option value="{{ group.id }}" {% if form.get('group_id') == group.id|string %}selected{% endif %}>{{ group.name }} ({{ plural(group.members|length, "member") }})</option>
                  {% endfor %}
                </select>
                <p class="help-block">They get their share of the group's projects straight away.</p>
              </div>
            </div>
            <div class="box-footer">
              <button type="submit" class="btn btn-primary">Add user</button>
              <a href="{{ url_for('admin.users') }}" class="btn btn-default">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
