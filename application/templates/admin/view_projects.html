{% extends "base.html" %}

{% block content %}
<!-- Content Header (Page header) -->
<section class="content-header">
	<h1>
		Projects
	</h1>
	<ol class="breadcrumb">
		<li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
		<li>Projects</li>
		<li class="active">View</li>
	</ol>
</section>
<section>
</section>

<section class="content">
	<p>
		<a class="btn btn-default" href="{{ url_for('admin.full_download') }}">
			<i class="fa fa-download"></i> Download all projects &amp; answers
		</a>
	</p>

	{% if projects %}
	<div class="row task-grid">
		{% for project in projects %}
		{% include "includes/project_card.html" %}
		{% endfor %}
	</div>
	{% else %}
	<div class="box"><div class="empty-state">
		<strong>No projects yet</strong>
		<a href="{{ url_for('annotation_admin.create_annotation_project') }}">Create a project</a>
	</div></div>
	{% endif %}
</section>
{% endblock %}
