{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Change Password</h4>
                        
                        
                        <form method="POST" action="{{ url_for('annotation.change_password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="form-group mb-3">
                                <label for="current_password">Current Password</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="current_password" 
                                       name="current_password" 
                                       required>
                            </div>
                            
                            <div class="form-group mb-3">
                                <label for="new_password">New Password</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="new_password" 
                                       name="new_password" 
                                       required 
                                       minlength="6">
                            </div>
                            
                            <div class="form-group mb-3">
                                <label for="confirm_password">Confirm New Password</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirm_password" 
                                       name="confirm_password" 
                                       required 
                                       minlength="6">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Change Password</button>
                            <a href="{{ url_for('annotation.profile') }}" class="btn btn-secondary ms-2">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
