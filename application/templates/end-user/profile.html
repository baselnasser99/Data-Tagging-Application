{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <img src="{{ url_for('static', filename='new/img/user1-128x128.jpg') }}" 
                             class="rounded-circle" 
                             alt="Profile Picture" 
                             style="width: 100px; height: 100px; object-fit: cover;">
                        <h5 class="mt-3">{{ session['name'] }}</h5>
                        <p class="text-muted">{{ session['email'] }}</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-9">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Profile Settings</h4>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="name">Full Name</label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="name" 
                                           value="{{ session['name'] }}" 
                                           disabled>
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="email">Email</label>
                                    <input type="email" 
                                           class="form-control" 
                                           id="email" 
                                           value="{{ session['email'] }}" 
                                           disabled>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <a href="{{ url_for('user.change_password') }}" 
                               class="btn btn-primary">Change Password</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
