{% from "includes/brand.html" import mark %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Error{% endblock %} – {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="error-page">
  <main>
    <a class="brand" href="{{ url_for('auth.login') }}">{{ mark() }} {{ app_name }}</a>
    <p class="error-code">Error {% block code %}{% endblock %}</p>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <a class="button" href="{{ url_for('auth.login') }}">Go to your dashboard</a>
  </main>
</body>
</html>
