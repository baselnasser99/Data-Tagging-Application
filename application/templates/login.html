{% extends "includes/auth_layout.html" %}
{% block title %}Sign in{% endblock %}
{% block form %}
<h2>Sign in</h2>
<p class="lede">Use the email address your project coordinator registered.</p>
{% include "flash_messages.html" %}
<form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" novalidate>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" type="email" name="email" autocomplete="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
  </div>
  <button type="submit" class="button">Sign in</button>
</form>
<p class="switch">New to {{ app_name }}? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
