{% extends "includes/auth_layout.html" %}
{% block title %}Create an account{% endblock %}
{% block form %}
<h2>Create an account</h2>
<p class="lede">You will see tasks once a coordinator adds you to a group.</p>
{% include "flash_messages.html" %}
<form action="{{ url_for('auth.register') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="fullname">Full name</label>
    <input id="fullname" type="text" name="fullname" autocomplete="name" required autofocus>
  </div>
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" type="email" name="email" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="new-password" minlength="6" required aria-describedby="password-hint">
    <span class="hint" id="password-hint">At least 6 characters.</span>
  </div>
  <button type="submit" class="button">Create account</button>
</form>
<p class="switch">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
{% endblock %}
