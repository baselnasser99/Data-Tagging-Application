  @keyframes mark-tag { 0%, 62%, 100% { transform: scale(1); } 74% { transform: scale(1.12); } 82% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .b, .t { animation: none; } }
</style>
